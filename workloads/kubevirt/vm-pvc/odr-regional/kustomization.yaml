# Kustomization for OpenShift Regional DR environment.
---
resources:
  - ../base
patches:
  # Use internal ceph cluster.
  - target:
      kind: PersistentVolumeClaim
      name: root-disk
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: ocs-storagecluster-ceph-rbd-virtualization
